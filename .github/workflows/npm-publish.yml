# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Release Version

on:
  push:
    branches: [release]

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      CI: true
      HUSKY: 0
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          registry-url: https://registry.npmjs.org

      - name: Configure npm authentication
        run: |
          echo "//registry.npmjs.org/:_authToken=\${NODE_AUTH_TOKEN}" > ~/.npmrc
          npm config set registry https://registry.npmjs.org
          npm config set access public
          echo "NPM registry configured"

      - name: Verify npm authentication
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "Error: NODE_AUTH_TOKEN is not set"
            echo "Please configure NPM_TOKEN secret in GitHub repository settings"
            exit 1
          fi
          echo "NODE_AUTH_TOKEN is set (length: ${#NODE_AUTH_TOKEN})"
          npm whoami --registry https://registry.npmjs.org || echo "Authentication check failed, will try to publish anyway"

      - name: Install Dependencies
        run: pnpm ci:install

      - name: Build Packages
        run: pnpm ci:build

      - name: Change Version
        run: pnpm ci:version

      - name: Publish packages
        run: pnpm ci:publish

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit --no-verify -m "chore(packages): version bump [skip ci]"
          git push origin release
        env:
          GITHUB_TOKEN: ${{ github.token }}
